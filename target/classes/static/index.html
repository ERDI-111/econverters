<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EconverterS — Ultimate Media Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05070f;
            --surface-card: rgba(18, 22, 41, 0.7);
            --surface-card-hover: rgba(28, 34, 61, 0.85);
            --primary-glow: #6366f1;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #05070f;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        /* Header Navigation */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: rgba(15, 18, 35, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a5b4fc, var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-pink));
            border: none;
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
        }

        /* Layout Main Grid */
        .dashboard-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 28px;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Cards Component */
        .card {
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .card p.desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        /* Input Controls */
        .input-box {
            position: relative;
            margin-bottom: 24px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(8, 11, 24, 0.8);
            border: 1.5px solid var(--border-glow);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s;
        }

        .input-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .selectors-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        .select-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .custom-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(8, 11, 24, 0.8);
            border: 1.5px solid var(--border-glow);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--primary-glow));
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.3);
            transition: all 0.25s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(6, 182, 212, 0.45);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* History Stream */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(8, 11, 24, 0.5);
            border: 1px solid var(--border-glow);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item .title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .history-item .tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            font-weight: 700;
        }

        /* Status Banner */
        .status-box {
            margin-top: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
        }
        .status-box.error { color: #f87171; }
        .status-box.success { color: #34d399; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ EconverterS</div>
        <div class="nav-actions">
            <button class="btn-ghost" onclick="alert('Login Modal Triggered')">Sign In</button>
            <button class="btn-glow" onclick="alert('Signup Modal Triggered')">Get Started</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Convert Workspace -->
        <div class="card">
            <h2>Media Converter</h2>
            <p class="desc">Paste links from YouTube or social platforms to extract MP3/MP4 instantly.</p>

            <form id="convertForm">
                <div class="input-box">
                    <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>

                <div class="selectors-row">
                    <div class="select-group">
                        <label>Format</label>
                        <select id="formatSelect" class="custom-select">
                            <option value="mp3">Audio (MP3)</option>
                            <option value="mp4">Video (MP4)</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label>Target Quality</label>
                        <select id="qualitySelect" class="custom-select">
                            <option value="best">⚡ Ultra Fast / Best Auto</option>
                            <option value="1080">1080p Full HD</option>
                            <option value="720">720p HD</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Convert & Download</button>
            </form>

            <div id="statusBox" class="status-box"></div>
        </div>

        <!-- Conversion Activity Feed -->
        <div class="card">
            <h2>Recent Conversions</h2>
            <p class="desc">Your processed files from this active session.</p>

            <div class="history-list" id="historyList">
                <p style="color: var(--text-sub); font-size: 0.85rem;" id="emptyMsg">No downloads in this session yet.</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('convertForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');
        const historyList = document.getElementById('historyList');
        const emptyMsg = document.getElementById('emptyMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const quality = document.getElementById('qualitySelect').value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Converting File...';
            statusBox.className = 'status-box';
            statusBox.innerText = 'Extracting media via yt-dlp...';

            try {
                const response = await fetch(`/api/convert?url=${encodeURIComponent(url)}&format=${format}&quality=${quality}`);
                if (!response.ok) throw new Error(await response.text() || 'Conversion failed.');

                const disposition = response.headers.get('Content-Disposition');
                let filename = `download.${format}`;
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/["']/g, '');
                }

                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = decodeURIComponent(filename);
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(downloadUrl);

                statusBox.className = 'status-box success';
                statusBox.innerText = 'Success! Download started.';

                // Add to History Feed
                if (emptyMsg) emptyMsg.style.display = 'none';
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span class="title">${decodeURIComponent(filename)}</span>
                    <span class="tag">${format.toUpperCase()}</span>
                `;
                historyList.prepend(item);

            } catch (err) {
                statusBox.className = 'status-box error';
                statusBox.innerText = err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Convert & Download';
            }
        });
    </script>
</body>
</html>
