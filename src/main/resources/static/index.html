<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EconverterS - Media Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00F2FE;
            --accent-pink: #FF007A;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(FF, 0, 122, 0.12) 0%, transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 620px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .url-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        .option-box {
            text-align: left;
        }

        .option-box label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .select-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .select-input option {
            background: #121826;
            color: #fff;
        }

        .convert-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), #00C6FF);
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.45);
        }

        .status-box {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">EconverterS</h1>
        <p class="subtitle">High-speed, unconstrained media conversion hub</p>

        <form id="convertForm">
            <div class="input-group">
                <input type="url" id="videoUrl" class="url-input" placeholder="Paste link here..." required>
            </div>

            <div class="options-grid">
                <div class="option-box">
                    <label>Format</label>
                    <select id="format" class="select-input">
                        <option value="mp3">Audio (MP3)</option>
                        <option value="mp4">Video (MP4)</option>
                    </select>
                </div>
                <div class="option-box">
                    <label>Quality</label>
                    <select id="quality" class="select-input">
                        <option value="best">Ultra Fast / Best Auto</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="convert-btn">Convert & Download</button>
        </form>

        <div id="status" class="status-box"></div>
    </div>

</body>
</html>
